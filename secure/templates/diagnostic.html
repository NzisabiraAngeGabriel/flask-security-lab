{% extends "base.html" %}
{% block title %}Diagnostic{% endblock %}
{% block content %}
  <h2>Network diagnostic</h2>
  <p>Run a single ping against a hostname or IP. Requires a valid login.</p>

  <form method="post" action="{{ url_for('diagnostic') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Host
      <input name="host" value="{{ host }}" required autofocus
             pattern="[A-Za-z0-9.\-]{1,253}">
    </label>
    <button type="submit">Run ping</button>
  </form>

  {% if error %}
    <p class="error">{{ error }}</p>
  {% endif %}

  {% if result %}
    <p class="ok">{{ result }}</p>
  {% endif %}
{% endblock %}
